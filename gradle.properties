# ==============================================================================
# TurboCraft Launcher — PC Edition Central Configuration (gradle.properties)
# Exact parity with TCL/gradle.properties from TCL-Team/TurboCraft-Launcher!
# Edit any property below — `npm run dev`, `npm run build`, and `npm run dist:*`
# automatically sync these values across the UI, Electron shell, JVM launch
# arguments, API services, and Windows/Linux/macOS installer packages.
# ==============================================================================

# Launcher Branding & App Identity
launcher_name=TurboCraft Launcher
launcher_app_name=TurboCraft Launcher — PC Edition
launcher_short_name=TCL
launcher_app_id=com.tcl.mc.pc
launcher_copyright=Copyright (C) 2026 TCL Team (GPL-3.0)

# Launcher Version (matches mobile versionCode & versionName)
launcher_version_code=9
launcher_version_name=1.6.0

# Official Project & Community Links
url_home=https://github.com/TCL-Team/TurboCraft-Launcher-PC-Edition
url_mobile_repo=https://github.com/TCL-Team/TurboCraft-Launcher
url_discord=https://discord.gg/bwkpJZB6NS
url_youtube=https://youtube.com/@TurboCraft_Launcher
url_github_org=https://github.com/TCL-Team

# OAuth Client ID (Microsoft / Xbox Live Device-Code Login)
# Default 00000000402b5328 is the public Minecraft Live Connect client ID.
# You can replace it with your own Azure / Live Connect Client ID or .oauth_client_id.txt
oauth_client_id=00000000402b5328

# Optional CurseForge API Key (or place in .curseforge_api.txt / CURSEFORGE_API_KEY env)
#curseforge_api_key=xxx

# Optional Discord Rich Presence Application ID (or place in .discord_app_id.txt / DISCORD_APP_ID env)
#discord_app_id=xxx

# Cross-Platform Supabase Social Hub Backend
social_supabase_url=https://qvjanukzamquosjxhxnc.supabase.co
social_supabase_publishable_key=sb_publishable_ErkdgkvWDiVqY6_xE0mZAw_yj-nptNo

# Default Theme & Performance Presets on First Launch
# Themes: VERDANT_DAWN | EMBERMIRE | VELVET_ROSE | MISTWAVE | GLACIER | VERDANTFIELD | URBAN_ASH | CUSTOM
default_theme=VERDANT_DAWN
default_custom_hex=#8BE51B
# Effects: fireflies | snow | rain | fireworks | hearts | bats | none
default_festival_effect=fireflies
default_ram_mb=4096
